name: Deploy Vue to GitHub Pages

on:
  push:
    branches: ["main"] 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 패키지 설치
        run: npm install

      - name: 프로젝트 빌드
        run: npm run build
        
      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: 깃허브 페이지에 배포
        id: deployment
        uses: actions/deploy-pages@v4